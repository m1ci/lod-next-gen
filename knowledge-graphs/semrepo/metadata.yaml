databus-account: knowledge-graph-catalog
id: semrepo
title: SemRepo

abstract: >-
  SemRepo is a large-scale RDF knowledge graph of GitHub repositories
  linked to scientific research. It captures fine-grained repository
  metadata and connects research software with the broader scholarly
  ecosystem.

description: >-
  SemRepo is a large-scale RDF knowledge graph for research software and
  its scholarly ecosystem. It describes GitHub repositories and related
  entities such as contributors, issues, dependencies, programming
  languages, organizations, packages, and research topics. SemRepo
  interlinks repositories with publications in Linked Papers With Code,
  repository authors with SemOpenAlex, and research artifacts with MLSea.
  It provides RDF dumps, persistent URI resolution, a public SPARQL
  endpoint, an OWL ontology, and VoID and DCAT metadata descriptions.

