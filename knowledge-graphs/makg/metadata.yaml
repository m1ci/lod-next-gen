databus-account: knowledge-graph-catalog
id: makg
title: Microsoft Academic Knowledge Graph

abstract: >-
  The Microsoft Academic Knowledge Graph (MAKG) is a large-scale RDF
  knowledge graph containing scholarly metadata about scientific
  publications, authors, institutions, venues, and fields of study.

description: >-
  The Microsoft Academic Knowledge Graph (MAKG) is an RDF representation
  and extension of the Microsoft Academic Graph. It contains more than
  eight billion RDF triples describing hundreds of millions of scientific
  publications and related entities such as authors, affiliations,
  journals, conferences, and fields of study. The enhanced MAKG additionally
  provides author name disambiguation, publication classifications,
  links to Wikidata, and other scholarly metadata.

